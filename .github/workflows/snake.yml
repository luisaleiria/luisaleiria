name: generate animation

on:
  # roda automaticamente todo dia à meia-noite UTC
  schedule:
    - cron: '0 0 * * *'
  # permite execução manual
  workflow_dispatch:
  # roda em todo push na branch principal (renomeie se for outro nome)
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1) Faz o checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Gera a animação SVG a partir do gráfico de contribuições
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3) Publica o SVG no branch `output`
      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
